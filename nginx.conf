server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache busting para archivos con hash
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desabilitar acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
}
